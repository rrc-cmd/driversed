<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Driver's Ed Study Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800;900&display=swap" rel="stylesheet">
<!--
  HOW TO ADD A NEW LESSON
  All content lives in the <script id="guide-data"> JSON below.
  1. Add {"n": 6, "title": "..."} to "lessons".
  2. Add units with "lesson": 6 to "units" (same shape as the existing ones).
  3. Add practice tests with "lesson": 6 to "tests" and signs to "signs" if needed.
  4. Add any new images to <script id="img-data"> (key -> data URI).
  In every question, the FIRST choice is the correct one. The page shuffles them.
-->
<style>
:root{
  --asphalt:#24272c; --surface:#2e3238; --surface2:#363b42; --line:#454b53;
  --text:#f2f0ea; --muted:#a9adb3; --stripe:#ffc53d; --guide:#0d7a45;
  --good:#3dd68c; --bad:#ff6b6b; --plate:#f7f6f2;
  --u:#ffc53d;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
body{background:var(--asphalt);color:var(--text);font-family:'Overpass',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:17px;line-height:1.6;min-height:100vh;
  padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%;display:block}
button{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:3px solid var(--stripe);outline-offset:2px}
b{font-weight:800}

/* nav */
#nav{position:sticky;top:0;z-index:50;background:rgba(36,39,44,.96);backdrop-filter:blur(10px);
  padding:env(safe-area-inset-top,0px) 14px 0;border-bottom:1px solid var(--line)}
#nav .in{display:flex;align-items:center;gap:8px;height:56px;overflow-x:auto;scrollbar-width:none;max-width:1000px;margin:0 auto}
#nav .in::-webkit-scrollbar{display:none}
.logo{font-weight:900;font-size:15px;white-space:nowrap;margin-right:6px;background:none;border:0;cursor:pointer;display:flex;align-items:center;gap:8px}
.logo i{display:inline-block;width:22px;height:22px;border-radius:5px;background:var(--guide);border:2px solid #fff}
.chip{border:1px solid var(--line);background:none;color:var(--muted);padding:6px 13px 4px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip:hover{color:var(--text)}
.chip .d{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:0}
.chip.on{background:var(--text);color:var(--asphalt);border-color:var(--text)}

/* the road stripe progress bar */
#road{height:10px;background:#1b1d21;position:relative;overflow:hidden}
#road .fill{position:absolute;inset:0 auto 0 0;width:0;transition:width .6s ease;
  background:repeating-linear-gradient(90deg,var(--stripe) 0 26px,transparent 26px 40px);background-position:0 0;
  top:3px;bottom:3px}

main{max-width:760px;margin:0 auto;padding:28px 18px 80px}

/* hero guide sign */
.hero{background:var(--guide);border-radius:16px;padding:6px;margin:10px 0 34px;box-shadow:0 10px 0 #1b1d21}
.hero .in{border:3px solid #fff;border-radius:11px;padding:26px 26px 22px;display:grid;grid-template-columns:1fr auto;gap:10px 20px;align-items:end}
.hero .course{font-weight:600;font-size:16px;opacity:.9}
.hero h1{font-weight:900;font-size:clamp(34px,7vw,54px);line-height:1.02;letter-spacing:-.01em;grid-column:1}
.hero .arrow{grid-row:1/3;grid-column:2;width:70px;height:70px}
.hero .shield{display:inline-block;background:#fff;color:var(--guide);font-weight:900;border-radius:8px 8px 18px 18px;padding:4px 12px 2px;font-size:15px;margin-bottom:6px}
.hero p{grid-column:1/3;font-size:16px;opacity:.95;margin-top:8px}
.lesson-h{font-weight:800;font-size:15px;color:var(--muted);margin:28px 0 12px}

/* exit rows */
.exit{display:flex;align-items:stretch;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;cursor:pointer;overflow:hidden}
.exit:hover{background:var(--surface2)}
.exit .tab{background:var(--u);color:#17191c;font-weight:900;font-size:13px;padding:10px 12px;min-width:72px;display:flex;flex-direction:column;justify-content:center;line-height:1.1}
.exit .tab span{font-size:24px}
.exit .body{flex:1;padding:12px 16px 10px}
.exit .t{font-weight:800;font-size:18px;line-height:1.25}
.exit .m{font-size:14px;color:var(--muted)}
.meter{height:5px;border-radius:3px;background:#1b1d21;margin-top:7px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--u);width:0}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:left;cursor:pointer}
.tool:hover{background:var(--surface2)}
.tool .t{font-weight:800;font-size:17px}
.tool .m{font-size:14px;color:var(--muted)}
.reset{margin-top:30px;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:14px}

/* unit page */
.uhead{border-left:10px solid var(--u);padding:4px 0 4px 16px;margin:6px 0 26px}
.uhead .k{font-size:15px;font-weight:600;color:var(--muted)}
.uhead h1{font-size:clamp(28px,6vw,40px);font-weight:900;line-height:1.08}
.uhead p{color:var(--muted);margin-top:8px}
.topic{margin:38px 0 0}
.topic h2{font-size:23px;font-weight:900;line-height:1.2;margin-bottom:14px;display:flex;gap:10px;align-items:baseline}
.topic h2 .n{flex:none;background:var(--u);color:#17191c;border-radius:6px;font-size:15px;padding:2px 8px 0}
.topic p{margin:0 0 14px}
ul.bul{list-style:none;margin:0 0 16px}
ul.bul li{padding-left:22px;position:relative;margin-bottom:8px}
ul.bul li::before{content:"";position:absolute;left:3px;top:.62em;width:9px;height:9px;background:var(--u);border-radius:2px}
ol.steps{list-style:none;counter-reset:s;margin:0 0 16px}
ol.steps li{counter-increment:s;display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:10px;padding:10px 14px;margin-bottom:8px}
ol.steps li::before{content:counter(s);background:var(--u);color:#17191c;font-weight:900;border-radius:50%;width:30px;height:30px;flex:none;display:grid;place-items:center;padding-top:3px}

.plates{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px;margin:4px 0 18px}
.plate{background:var(--plate);border-radius:10px;padding:10px;display:flex;flex-direction:column;align-items:center}
.plate img{height:104px;width:100%;object-fit:contain}
.plate figcaption{color:#2a2d31;font-size:14px;font-weight:700;text-align:center;line-height:1.25;margin-top:8px}
.photo{margin:4px 0 18px}
.photo img{border-radius:10px;max-height:380px;width:auto;margin:0 auto}
.photo figcaption{font-size:14px;color:var(--muted);margin-top:6px}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:4px 0 18px}
.photos img{border-radius:10px;height:170px;width:100%;object-fit:cover}
.photos figcaption{font-size:14px;color:var(--muted);margin-top:6px}
.split{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center;margin:4px 0 18px}
.split .plate img{height:150px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:4px 0 18px}
.compare .cell{background:var(--surface);border-radius:12px;padding:12px}
.compare .cell .plate img{height:110px}
.compare .cell div.tx{margin-top:10px;font-size:16px}
.facts{display:grid;gap:10px;margin:4px 0 18px}
.fact{display:grid;grid-template-columns:110px 1fr;gap:16px;align-items:center;background:var(--surface);border-radius:12px;padding:10px}
.facts.wide .fact{grid-template-columns:230px 1fr}
.fact .pic{background:var(--plate);border-radius:8px;height:140px;display:grid;place-items:center;overflow:hidden}
.fact .pic img{max-height:136px;object-fit:contain}
.fact .dot{width:64px;height:64px;border-radius:50%;margin:auto;box-shadow:0 0 22px currentColor;animation:blink 1.1s steps(1) infinite}
.fact .big{font-weight:900;font-size:22px;line-height:1.1;color:var(--u)}
@keyframes blink{50%{opacity:.18}}
@media (prefers-reduced-motion:reduce){.fact .dot{animation:none}}

.box{border-radius:12px;padding:14px 16px 12px;margin:4px 0 18px;border:2px solid var(--line);background:#2a2d33}
.box.tip{border-color:var(--stripe)}
.box.tip::before{content:"Remember";display:block;font-weight:900;color:var(--stripe);font-size:14px}
.box.note::before{content:"From class";display:block;font-weight:900;color:var(--muted);font-size:14px}
.box.key{border-color:var(--good)}
.box.key::before{content:"Know this";display:block;font-weight:900;color:var(--good);font-size:14px}

/* lines */
.lines{display:grid;gap:10px;margin:4px 0 18px}
.lrow{display:grid;grid-template-columns:170px 1fr;gap:16px;align-items:center;background:var(--surface);border-radius:12px;padding:10px}
.lane{height:64px;background:#3b3f45;border-radius:8px;position:relative;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:0 10px}
.ln{height:6px;border-radius:2px}
.ln.sy{background:var(--stripe)}
.ln.by{background:repeating-linear-gradient(90deg,var(--stripe) 0 22px,transparent 22px 36px)}
.ln.sw{background:#fff}
.ln.bw{background:repeating-linear-gradient(90deg,#fff 0 22px,transparent 22px 36px)}
.lrow .nm{font-weight:800}
.lrow .rule{font-weight:900;color:var(--u)}
.lrow .sub{font-size:14px;color:var(--muted)}
.cmp2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:4px 0 18px}
.cmp2 .cell{background:var(--surface);border-radius:12px;padding:12px}
.cmp2 .lane{margin-bottom:10px}

/* questions */
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:22px 0 0}
.q .lab{font-size:14px;font-weight:800;color:var(--u)}
.q .qt{font-weight:800;font-size:18px;line-height:1.35;margin:4px 0 12px}
.q .qimg{background:var(--plate);border-radius:10px;padding:10px;margin-bottom:12px;display:flex;justify-content:center}
.q .qimg img{max-height:170px;object-fit:contain}
.ch{display:grid;gap:8px}
.c{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--asphalt);border:2px solid var(--line);border-radius:10px;padding:10px 12px 8px;cursor:pointer;font-size:16px;line-height:1.35}
.c:hover:not(:disabled){border-color:var(--muted)}
.c .L{flex:none;width:28px;height:28px;border-radius:6px;background:var(--surface2);display:grid;place-items:center;font-weight:900;font-size:14px;padding-top:2px}
.c:disabled{cursor:default}
.c.ok{border-color:var(--good);background:rgba(61,214,140,.12)}
.c.ok .L{background:var(--good);color:#10231a}
.c.no{border-color:var(--bad);background:rgba(255,107,107,.12)}
.c.no .L{background:var(--bad);color:#2a1010}
.c.dim{opacity:.5}
.fb{margin-top:12px;border-radius:10px;padding:10px 12px 8px;font-size:16px}
.fb.ok{background:rgba(61,214,140,.14)} .fb.no{background:rgba(255,107,107,.14)}
.fb strong{font-weight:900}

.qz-head{margin:54px 0 0;padding-top:22px;border-top:4px dashed var(--line)}
.qz-head h2{font-size:26px;font-weight:900}
.qz-head p{color:var(--muted)}
.score{margin-top:22px;background:var(--surface2);border-radius:14px;padding:20px;text-align:center}
.score .big{font-size:44px;font-weight:900;color:var(--u);line-height:1}
.btn{background:var(--text);color:var(--asphalt);border:0;border-radius:10px;padding:11px 18px 9px;font-weight:800;cursor:pointer;font-size:16px}
.btn.ghost{background:none;color:var(--text);border:2px solid var(--line)}
.row{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:40px}
.row.c1{justify-content:center;margin-top:14px}

/* flashcards */
.fc-wrap{perspective:1200px;margin:18px 0}
.fc{position:relative;height:340px;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc .side{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px}
.fc .front{background:var(--plate);color:#1d2024}
.fc .front img{max-height:210px;object-fit:contain}
.fc .front .ft{font-size:24px;font-weight:900;line-height:1.2}
.fc .back{background:var(--surface2);transform:rotateY(180deg);font-size:22px;font-weight:800;line-height:1.35;border:3px solid var(--u)}
.fc .hint{position:absolute;bottom:12px;font-size:13px;color:#777;font-weight:600}
@media (prefers-reduced-motion:reduce){.fc{transition:none}}
.fc .front .lane{width:85%;height:120px;gap:14px;padding:0 16px}
.fc .front .lane .ln{height:10px}
.fc .front .dotwrap{background:#1b1d21;border-radius:14px;width:180px;height:180px;display:grid;place-items:center}
.fc .front .dot{width:110px;height:110px;border-radius:50%;box-shadow:0 0 30px currentColor;animation:blink 1.1s steps(1) infinite}
.fc .back .nm{font-size:26px;font-weight:900;color:var(--u)}
.fc .back .mn{font-size:19px;font-weight:600}
.fc .back img{max-height:150px;object-fit:contain;background:var(--plate);border-radius:10px;padding:8px}
.fc .back .lane{width:85%;height:90px}
.fc .back .dotwrap{width:120px;height:120px;border-radius:12px;background:#1b1d21;display:grid;place-items:center}
.fc .back .dot{width:70px;height:70px;border-radius:50%;box-shadow:0 0 24px currentColor}
.bar .sel{display:flex;gap:8px;flex-wrap:wrap}
select{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:15px}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.count{color:var(--muted);font-weight:600}

@media (max-width:560px){
  body{font-size:16px}
  .tools,.compare,.cmp2{grid-template-columns:1fr}
  .split{grid-template-columns:110px 1fr}
  .split .plate img{height:110px}
  .lrow{grid-template-columns:1fr}
  .facts.wide .fact,.fact{grid-template-columns:96px 1fr}
  .facts.wide .fact{grid-template-columns:1fr}
  .photos{grid-template-columns:1fr}
  .hero .arrow{width:50px;height:50px}
}
</style>
</head>

<script>
(function(){
var D = JSON.parse(document.getElementById('guide-data').textContent);
var IM = JSON.parse(document.getElementById('img-data').textContent);
var main = document.getElementById('main');
var KEY = 'drivers-ed-guide-v1';
var S = {a:{}};
try { var raw = localStorage.getItem(KEY); if (raw) S = JSON.parse(raw) || S; } catch(e) {}
if (!S.a) S.a = {};
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }

var LET = ['A','B','C','D','E','F'];
function unitById(id){ for (var i=0;i<D.units.length;i++) if (D.units[i].id===id) return D.units[i]; return null; }
function unitNum(u){ var n=0; for (var i=0;i<D.units.length;i++){ if (D.units[i].lesson===u.lesson) n++; if (D.units[i]===u) return n; } return n; }
function img(k, alt){ return IM[k] ? '<img src="'+IM[k]+'" alt="'+(alt||'').replace(/"/g,'&quot;')+'">' : ''; }
function hash(s){ var h=2166136261; for (var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }
function order(id, n, fixed){
  var a=[]; for (var i=0;i<n;i++) a.push(i);
  if (fixed) return a;
  var h=hash(id);
  for (var j=n-1;j>0;j--){ h=Math.imul(h^(h>>>15),2246822507)>>>0; var r=h%(j+1); var t=a[j]; a[j]=a[r]; a[r]=t; }
  return a;
}
function shuffle(a){ a=a.slice(); for (var i=a.length-1;i>0;i--){ var r=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[r]; a[r]=t; } return a; }

/* ---------- question rendering (shared by check-ins, quizzes, tests) ---------- */
function qHTML(id, q, label){
  var ord = order(id, q.c.length, q.fixed);
  var ans = S.a[id];
  var done = ans !== undefined;
  var h = '<div class="q" id="q-'+id+'">';
  h += '<div class="lab">'+label+'</div><div class="qt">'+q.q+'</div>';
  if (q.img) h += '<div class="qimg">'+img(q.img,'')+'</div>';
  h += '<div class="ch">';
  ord.forEach(function(ci, pos){
    var cls = '';
    if (done){ if (ci===0) cls=' ok'; else if (ci===ans) cls=' no'; else cls=' dim'; }
    h += '<button class="c'+cls+'" data-act="ans" data-q="'+id+'" data-c="'+ci+'"'+(done?' disabled':'')+'><span class="L">'+LET[pos]+'</span><span>'+q.c[ci]+'</span></button>';
  });
  h += '</div>';
  if (done) h += fbHTML(q, ans===0, ord);
  h += '</div>';
  return h;
}
function fbHTML(q, right, ord){
  var pos = ord.indexOf(0);
  if (right) return '<div class="fb ok"><strong>Correct!</strong> '+q.fb+'</div>';
  return '<div class="fb no"><strong>Not quite.</strong> The answer is <strong>'+LET[pos]+': '+q.c[0]+'</strong>. '+q.fb+'</div>';
}
var QINDEX = {};
function registerQ(id, q){ QINDEX[id] = q; }

/* ---------- content blocks ---------- */
function lineLane(kind){
  var m = {
    dy:'<div class="ln sy"></div><div class="ln sy"></div>',
    sb:'<div class="ln by"></div><div class="ln sy"></div>',
    by:'<div class="ln by"></div>',
    bw:'<div class="ln bw"></div>',
    sw:'<div class="ln sw"></div>',
    yellow:'<div class="ln sy"></div>',
    white:'<div class="ln sw"></div>'
  };
  return '<div class="lane">'+m[kind]+'</div>';
}
function block(b){
  switch(b.t){
    case 'p': return '<p>'+b.h+'</p>';
    case 'list': return '<ul class="bul">'+b.items.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul>';
    case 'steps': return '<ol class="steps">'+b.items.map(function(x){return '<li><span>'+x+'</span></li>';}).join('')+'</ol>';
    case 'signs': return '<div class="plates">'+b.items.map(function(x){return '<figure class="plate">'+img(x[0],x[1])+'<figcaption>'+x[1]+'</figcaption></figure>';}).join('')+'</div>';
    case 'photo': return '<figure class="photo">'+img(b.k,b.cap)+'<figcaption>'+b.cap+'</figcaption></figure>';
    case 'photos': return '<div class="photos">'+b.items.map(function(x){return '<figure>'+img(x[0],x[1])+'<figcaption>'+x[1]+'</figcaption></figure>';}).join('')+'</div>';
    case 'split': return '<div class="split"><figure class="plate">'+img(b.k,'')+'</figure><div>'+b.h+'</div></div>';
    case 'compare': return '<div class="compare">'+b.items.map(function(x){return '<div class="cell"><div class="plate">'+img(x.k,'')+'</div><div class="tx">'+x.h+'</div></div>';}).join('')+'</div>';
    case 'compare2': return '<div class="cmp2">'+b.items.map(function(x){return '<div class="cell">'+lineLane(x.line)+'<div>'+x.h+'</div></div>';}).join('')+'</div>';
    case 'facts': return '<div class="facts'+(b.wide?' wide':'')+'">'+b.items.map(function(x){
        var pic = x.k ? '<div class="pic">'+img(x.k,'')+'</div>' : '<div class="pic" style="background:#1b1d21"><div class="dot" style="background:'+x.dot+';color:'+x.dot+'"></div></div>';
        return '<div class="fact">'+pic+'<div><div class="big">'+x.big+'</div><div>'+x.h+'</div></div></div>';
      }).join('')+'</div>';
    case 'box': return '<div class="box '+b.kind+'">'+b.h+'</div>';
    case 'lines':
      var rows = [
        ['dy','Double yellow lines','NO PASSING',''],
        ['sb','Solid and broken yellow','PASS ON BROKEN SIDE ONLY','Only drivers next to the dashed line may pass.'],
        ['by','Broken yellow','YOU MAY PASS ON EITHER SIDE',''],
        ['bw','Broken white lines','YOU MAY PASS ON EITHER SIDE',''],
        ['sw','Solid white line','NO PASSING','Between lanes or on the outer edges of the road.']
      ];
      return '<div class="lines">'+rows.map(function(r){ return '<div class="lrow">'+lineLane(r[0])+'<div><div class="nm">'+r[1]+'</div><div class="rule">'+r[2]+'</div>'+(r[3]?'<div class="sub">'+r[3]+'</div>':'')+'</div></div>'; }).join('')+'</div>';
  }
  return '';
}

/* ---------- progress ---------- */
function unitIds(u){
  var ids=[]; u.topics.forEach(function(t,i){ ids.push('ci:'+u.id+':'+i); });
  u.quiz.forEach(function(q,i){ ids.push('qz:'+u.id+':'+i); });
  return ids;
}
function pct(ids){ if(!ids.length) return 0; var n=0; ids.forEach(function(id){ if (S.a[id]!==undefined) n++; }); return Math.round(100*n/ids.length); }
function updateRoad(){
  var all=[]; D.units.forEach(function(u){ all=all.concat(unitIds(u)); });
  document.getElementById('roadfill').style.width = pct(all)+'%';
}

/* ---------- nav ---------- */
function renderNav(view){
  var h = '<button class="logo" data-act="go" data-to="home"><i></i>Driver\u2019s Ed</button>';
  D.units.forEach(function(u){
    h += '<button class="chip'+(view==='u/'+u.id?' on':'')+'" data-act="go" data-to="u/'+u.id+'"><span class="d" style="background:'+u.color+'"></span>'+u.title+'</button>';
  });
  h += '<button class="chip'+(view==='cards'?' on':'')+'" data-act="go" data-to="cards">Flashcards</button>';
  h += '<button class="chip'+(view==='symbols'?' on':'')+'" data-act="go" data-to="symbols">Sign Flashcards</button>';
  h += '<button class="chip'+(view==='signs'?' on':'')+'" data-act="go" data-to="signs">Name That Sign</button>';
  D.tests.forEach(function(t,i){ h += '<button class="chip'+(view==='test/'+i?' on':'')+'" data-act="go" data-to="test/'+i+'">'+t.title+'</button>'; });
  document.getElementById('navin').innerHTML = h;
  var on = document.querySelector('#navin .on'); if (on && on.scrollIntoView) on.scrollIntoView({inline:'center',block:'nearest'});
}

/* ---------- home ---------- */
function renderHome(){
  var L = D.lessons[D.lessons.length-1];
  var h = '<section class="hero"><div class="in">';
  h += '<div><span class="shield">Lesson '+L.n+'</span><div class="course">'+D.course+' study guide</div></div>';
  h += '<svg class="arrow" viewBox="0 0 70 70" aria-hidden="true"><path d="M14 56 L50 20 M26 18 H52 V44" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="square"/></svg>';
  h += '<h1>'+L.title+'</h1>';
  h += '<p>Read each section, answer the check-in questions, then take the quiz at the end. Your answers are saved on this device.</p>';
  h += '</div></section>';
  D.lessons.slice().reverse().forEach(function(les){
    if (D.lessons.length>1) h += '<div class="lesson-h">Lesson '+les.n+': '+les.title+'</div>';
    else h += '<div class="lesson-h">Sections</div>';
    D.units.filter(function(u){return u.lesson===les.n;}).forEach(function(u){
      var p = pct(unitIds(u));
      h += '<button class="exit" style="--u:'+u.color+'" data-act="go" data-to="u/'+u.id+'"><div class="tab">Exit<span>'+unitNum(u)+'</span></div><div class="body"><div class="t">'+u.title+'</div><div class="m">'+u.topics.length+' topics, '+u.quiz.length+'-question quiz \u2022 '+p+'% done</div><div class="meter"><i style="width:'+p+'%"></i></div></div></button>';
    });
  });
  h += '<div class="lesson-h">Practice</div><div class="tools">';
  h += '<button class="tool" data-act="go" data-to="cards"><div class="t">Flashcards</div><div class="m">Tap to flip. Filter by section.</div></button>';
  h += '<button class="tool" data-act="go" data-to="symbols"><div class="t">Sign Flashcards</div><div class="m">Every sign, line, and signal. Picture on the front, meaning on the back.</div></button>';
  h += '<button class="tool" data-act="go" data-to="signs"><div class="t">Name That Sign</div><div class="m">See a real sign, pick its name.</div></button>';
  D.tests.forEach(function(t,i){
    var ids = t.qs.map(function(q,j){return 'ts:'+i+':'+j;});
    h += '<button class="tool" data-act="go" data-to="test/'+i+'"><div class="t">'+t.title+'</div><div class="m">'+t.qs.length+' questions \u2022 '+pct(ids)+'% done</div></button>';
  });
  h += '</div><button class="reset" data-act="reset">Clear all my answers and start over</button>';
  main.innerHTML = h;
}

/* ---------- unit ---------- */
function renderUnit(id){
  var u = unitById(id); if (!u) return renderHome();
  main.style.setProperty('--u', u.color);
  var h = '<header class="uhead"><div class="k">Lesson '+u.lesson+' \u2022 Exit '+unitNum(u)+'</div><h1>'+u.title+'</h1><p>'+u.intro+'</p></header>';
  u.topics.forEach(function(t,i){
    h += '<section class="topic"><h2><span class="n">'+(i+1)+'</span><span>'+t.h+'</span></h2>';
    h += t.blocks.map(block).join('');
    var qid = 'ci:'+u.id+':'+i; registerQ(qid, t.ci);
    h += qHTML(qid, t.ci, 'Check-in');
    h += '</section>';
  });
  h += '<div class="qz-head"><h2>'+u.title+' quiz</h2><p>'+u.quiz.length+' questions. Answer them all to see your score.</p></div>';
  u.quiz.forEach(function(q,i){ var qid='qz:'+u.id+':'+i; registerQ(qid,q); h += qHTML(qid,q,'Question '+(i+1)+' of '+u.quiz.length); });
  h += '<div id="score-'+u.id+'">'+scoreHTML('qz:'+u.id, u.quiz.length, 'retake-unit', u.id)+'</div>';
  var idx = D.units.indexOf(u);
  h += '<div class="row">';
  h += idx>0 ? '<button class="btn ghost" data-act="go" data-to="u/'+D.units[idx-1].id+'">Back: '+D.units[idx-1].title+'</button>' : '<button class="btn ghost" data-act="go" data-to="home">Home</button>';
  h += idx<D.units.length-1 ? '<button class="btn" data-act="go" data-to="u/'+D.units[idx+1].id+'">Next: '+D.units[idx+1].title+'</button>' : '<button class="btn" data-act="go" data-to="test/0">Take Practice Test 1</button>';
  h += '</div>';
  main.innerHTML = h;
}
function scoreHTML(prefix, n, act, arg){
  var got=0, done=0;
  for (var i=0;i<n;i++){ var a=S.a[prefix+':'+i]; if (a!==undefined){ done++; if (a===0) got++; } }
  if (done<n) return '<div class="score"><div class="count">'+done+' of '+n+' answered</div></div>';
  var p = Math.round(100*got/n);
  var msg = p>=90 ? 'Excellent. You know this.' : p>=70 ? 'Good. Review the ones you missed.' : 'Go back over the section, then retake it.';
  return '<div class="score"><div class="big">'+got+' / '+n+'</div><div style="margin:6px 0 14px">'+p+'% \u2022 '+msg+'</div><button class="btn" data-act="'+act+'" data-arg="'+arg+'">Retake</button></div>';
}

/* ---------- practice test ---------- */
function renderTest(i){
  var t = D.tests[i]; if (!t) return renderHome();
  main.style.setProperty('--u', '#ffc53d');
  var h = '<header class="uhead"><div class="k">Lesson '+t.lesson+' \u2022 all sections</div><h1>'+t.title+'</h1><p>'+t.qs.length+' questions from every section. Answer them all to see your score.</p></header>';
  t.qs.forEach(function(q,j){ var qid='ts:'+i+':'+j; registerQ(qid,q); h += qHTML(qid,q,'Question '+(j+1)+' of '+t.qs.length); });
  h += '<div id="score-test-'+i+'">'+scoreHTML('ts:'+i, t.qs.length, 'retake-test', i)+'</div>';
  h += '<div class="row"><button class="btn ghost" data-act="go" data-to="home">Home</button>';
  if (D.tests[i+1]) h += '<button class="btn" data-act="go" data-to="test/'+(i+1)+'">'+D.tests[i+1].title+'</button>';
  h += '</div>';
  main.innerHTML = h;
}

/* ---------- flashcards ---------- */
var FC = {filter:'all', deck:[], i:0, flip:false};
function buildDeck(){
  var d=[];
  D.units.forEach(function(u){ if (FC.filter==='all' || FC.filter===u.id) u.cards.forEach(function(c){ d.push({c:c,u:u}); }); });
  FC.deck=d; FC.i=0; FC.flip=false;
}
function renderCards(){
  if (!FC.deck.length) buildDeck();
  main.style.setProperty('--u', '#ffc53d');
  var h = '<header class="uhead"><div class="k">Practice</div><h1>Flashcards</h1><p>Tap the card (or press space) to flip it. Use the arrow keys to move.</p></header>';
  h += '<div class="bar"><select id="fc-filter" aria-label="Choose a section"><option value="all">All sections</option>';
  D.units.forEach(function(u){ h += '<option value="'+u.id+'"'+(FC.filter===u.id?' selected':'')+'>'+u.title+'</option>'; });
  h += '</select><span class="count">Card '+(FC.i+1)+' of '+FC.deck.length+'</span></div>';
  var it = FC.deck[FC.i], c = it.c;
  var front = (c.img ? img(c.img,'') : '') + (c.f ? '<div class="ft">'+c.f+'</div>' : (c.img ? '<div class="ft" style="font-size:18px">What is this?</div>' : ''));
  h += '<div class="fc-wrap" style="--u:'+it.u.color+'"><div class="fc'+(FC.flip?' flip':'')+'" id="fc" data-act="flip" role="button" tabindex="0" aria-label="Flip card"><div class="side front">'+front+'<div class="hint">'+it.u.title+' \u2022 tap to flip</div></div><div class="side back">'+c.b+'</div></div></div>';
  h += '<div class="row c1"><button class="btn ghost" data-act="fc-prev">Previous</button><button class="btn ghost" data-act="fc-shuffle">Shuffle</button><button class="btn" data-act="fc-next">Next</button></div>';
  main.innerHTML = h;
}

/* ---------- sign & symbol flashcards ---------- */
var SY = {cat:'All', mode:'pic', deck:[], i:0, flip:false};
var SYCATS = [['All','All signs and symbols'],['Regulatory','Regulatory signs'],['Warning','Warning signs'],['Guide','Guide signs and route markers'],['Pavement','Pavement markings'],['Signals','Traffic signals and officers']];
var SYCOL = {Regulatory:'#e5484d',Warning:'#f5c518',Guide:'#30a46c',Pavement:'#dcd8cc',Signals:'#f76b15'};
function buildSY(){ SY.deck = D.symbols.filter(function(x){ return SY.cat==='All' || x[4]===SY.cat; }); SY.i=0; SY.flip=false; }
function symPic(x){
  if (x[0]==='img') return img(x[1], '');
  if (x[0]==='line') return lineLane(x[1]);
  return '<div class="dotwrap"><div class="dot" style="background:'+x[1]+';color:'+x[1]+'"></div></div>';
}
function renderSymbols(){
  if (!SY.deck.length) buildSY();
  main.style.setProperty('--u', '#ffc53d');
  var h = '<header class="uhead"><div class="k">Practice</div><h1>Sign Flashcards</h1><p>Every sign, line, and signal from the lesson. Tap the card (or press space) to flip it. Use the arrow keys to move.</p></header>';
  h += '<div class="bar"><div class="sel"><select id="sy-cat" aria-label="Choose a group">';
  SYCATS.forEach(function(c){ h += '<option value="'+c[0]+'"'+(SY.cat===c[0]?' selected':'')+'>'+c[1]+'</option>'; });
  h += '</select><select id="sy-mode" aria-label="Which side first"><option value="pic"'+(SY.mode==='pic'?' selected':'')+'>Picture first</option><option value="name"'+(SY.mode==='name'?' selected':'')+'>Name first</option></select></div>';
  h += '<span class="count">Card '+(SY.i+1)+' of '+SY.deck.length+'</span></div>';
  var x = SY.deck[SY.i], col = SYCOL[x[4]];
  var front, back;
  if (SY.mode==='pic'){
    front = symPic(x) + '<div class="ft" style="font-size:18px">What does this mean?</div>';
    back = '<div class="nm">'+x[2]+'</div><div class="mn">'+x[3]+'</div>';
  } else {
    front = '<div class="ft">'+x[2]+'</div><div style="font-size:16px;color:#555">What does it look like, and what does it mean?</div>';
    back = symPic(x) + '<div class="mn">'+x[3]+'</div>';
  }
  h += '<div class="fc-wrap" style="--u:'+col+'"><div class="fc'+(SY.flip?' flip':'')+'" id="fc" data-act="sy-flip" role="button" tabindex="0" aria-label="Flip card" style="height:380px"><div class="side front">'+front+'<div class="hint">'+x[4]+' \u2022 tap to flip</div></div><div class="side back">'+back+'</div></div></div>';
  h += '<div class="row c1"><button class="btn ghost" data-act="sy-prev">Previous</button><button class="btn ghost" data-act="sy-shuffle">Shuffle</button><button class="btn" data-act="sy-next">Next</button></div>';
  main.innerHTML = h;
}

/* ---------- name that sign ---------- */
var SQ = {cat:'All', deck:[], i:0, score:0, picked:null, opts:[]};
function buildSQ(){
  SQ.deck = shuffle(D.signs.filter(function(s){ return SQ.cat==='All' || s[2]===SQ.cat; }));
  SQ.i=0; SQ.score=0; SQ.picked=null; makeOpts();
}
function makeOpts(){
  var s = SQ.deck[SQ.i]; if (!s) return;
  var same = D.signs.filter(function(x){ return x[2]===s[2] && x[1]!==s[1]; });
  var pool = same.length>=3 ? same : D.signs.filter(function(x){ return x[1]!==s[1]; });
  var seen={}; var wrong=[];
  shuffle(pool).forEach(function(x){ if (wrong.length<3 && !seen[x[1]]){ seen[x[1]]=1; wrong.push(x[1]); } });
  SQ.opts = shuffle([s[1]].concat(wrong));
}
function renderSigns(){
  if (!SQ.deck.length) buildSQ();
  main.style.setProperty('--u', '#ffc53d');
  var h = '<header class="uhead"><div class="k">Practice</div><h1>Name That Sign</h1><p>These are the signs from your class slides. Pick the right name.</p></header>';
  h += '<div class="bar"><select id="sq-cat" aria-label="Sign type">';
  ['All','Regulatory','Warning','Guide'].forEach(function(c){ h += '<option'+(SQ.cat===c?' selected':'')+'>'+(c==='All'?'All':c)+'</option>'; });
  h += '</select><span class="count">';
  if (SQ.i < SQ.deck.length) h += 'Sign '+(SQ.i+1)+' of '+SQ.deck.length+' \u2022 Score '+SQ.score;
  h += '</span></div>';
  if (SQ.i >= SQ.deck.length){
    h += '<div class="score"><div class="big">'+SQ.score+' / '+SQ.deck.length+'</div><div style="margin:6px 0 14px">signs named correctly</div><button class="btn" data-act="sq-restart">Play again</button></div>';
    main.innerHTML = h; return;
  }
  var s = SQ.deck[SQ.i];
  h += '<div class="q"><div class="lab">'+(SQ.picked===null?'What is this sign?':s[2]+' sign')+'</div><div class="qimg" style="margin-top:8px">'+img(s[0],'')+'</div><div class="ch">';
  SQ.opts.forEach(function(o,k){
    var cls='';
    if (SQ.picked!==null){ if (o===s[1]) cls=' ok'; else if (k===SQ.picked) cls=' no'; else cls=' dim'; }
    h += '<button class="c'+cls+'" data-act="sq-pick" data-k="'+k+'"'+(SQ.picked!==null?' disabled':'')+'><span class="L">'+LET[k]+'</span><span>'+o+'</span></button>';
  });
  h += '</div>';
  if (SQ.picked!==null){
    var right = SQ.opts[SQ.picked]===s[1];
    h += '<div class="fb '+(right?'ok':'no')+'"><strong>'+(right?'Correct!':'Not quite.')+'</strong> This is <strong>'+s[1]+'</strong>, a '+s[2].toLowerCase()+' sign.</div>';
    h += '<div class="row c1"><button class="btn" data-act="sq-next" id="sq-next">Next sign</button></div>';
  }
  h += '</div>';
  main.innerHTML = h;
  var nx = document.getElementById('sq-next'); if (nx) nx.focus();
}

/* ---------- router ---------- */
function route(){
  var v = (location.hash||'#home').slice(1);
  main.style.removeProperty('--u');
  renderNav(v);
  if (v.indexOf('u/')===0) renderUnit(v.slice(2));
  else if (v==='cards') renderCards();
  else if (v==='signs') renderSigns();
  else if (v==='symbols') renderSymbols();
  else if (v.indexOf('test/')===0) renderTest(parseInt(v.slice(5),10));
  else renderHome();
  updateRoad();
}
function go(to){ if (location.hash==='#'+to) route(); else location.hash = to; window.scrollTo(0,0); }
window.addEventListener('hashchange', function(){ route(); window.scrollTo(0,0); });

/* ---------- events (no inline handlers: Vercel CSP-safe) ---------- */
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]'); if (!el) return;
  var act = el.getAttribute('data-act');
  if (act==='go') { go(el.getAttribute('data-to')); return; }
  if (act==='ans') {
    var id = el.getAttribute('data-q'), ci = parseInt(el.getAttribute('data-c'),10);
    if (S.a[id]!==undefined) return;
    S.a[id] = ci; save();
    var q = QINDEX[id]; var box = document.getElementById('q-'+id);
    var lab = box.querySelector('.lab').innerHTML;
    var tmp = document.createElement('div'); tmp.innerHTML = qHTML(id, q, lab);
    box.parentNode.replaceChild(tmp.firstChild, box);
    var parts = id.split(':');
    if (parts[0]==='qz'){ var u=unitById(parts[1]); document.getElementById('score-'+u.id).innerHTML = scoreHTML('qz:'+u.id, u.quiz.length, 'retake-unit', u.id); }
    if (parts[0]==='ts'){ var ti=parseInt(parts[1],10); document.getElementById('score-test-'+ti).innerHTML = scoreHTML('ts:'+ti, D.tests[ti].qs.length, 'retake-test', ti); }
    updateRoad();
    return;
  }
  if (act==='retake-unit'){ var uid=el.getAttribute('data-arg'); var uu=unitById(uid); uu.quiz.forEach(function(q,i){ delete S.a['qz:'+uid+':'+i]; }); save(); renderUnit(uid); updateRoad(); var qh=document.querySelector('.qz-head'); if(qh) qh.scrollIntoView(); return; }
  if (act==='retake-test'){ var t=parseInt(el.getAttribute('data-arg'),10); D.tests[t].qs.forEach(function(q,j){ delete S.a['ts:'+t+':'+j]; }); save(); renderTest(t); window.scrollTo(0,0); return; }
  if (act==='reset'){ if (confirm('Clear all saved answers?')){ S={a:{}}; save(); route(); } return; }
  if (act==='flip'){ FC.flip=!FC.flip; document.getElementById('fc').classList.toggle('flip', FC.flip); return; }
  if (act==='fc-next'){ FC.i=(FC.i+1)%FC.deck.length; FC.flip=false; renderCards(); return; }
  if (act==='fc-prev'){ FC.i=(FC.i-1+FC.deck.length)%FC.deck.length; FC.flip=false; renderCards(); return; }
  if (act==='fc-shuffle'){ FC.deck=shuffle(FC.deck); FC.i=0; FC.flip=false; renderCards(); return; }
  if (act==='sy-flip'){ SY.flip=!SY.flip; document.getElementById('fc').classList.toggle('flip', SY.flip); return; }
  if (act==='sy-next'){ SY.i=(SY.i+1)%SY.deck.length; SY.flip=false; renderSymbols(); return; }
  if (act==='sy-prev'){ SY.i=(SY.i-1+SY.deck.length)%SY.deck.length; SY.flip=false; renderSymbols(); return; }
  if (act==='sy-shuffle'){ SY.deck=shuffle(SY.deck); SY.i=0; SY.flip=false; renderSymbols(); return; }
  if (act==='sq-pick'){ if (SQ.picked!==null) return; SQ.picked=parseInt(el.getAttribute('data-k'),10); if (SQ.opts[SQ.picked]===SQ.deck[SQ.i][1]) SQ.score++; renderSigns(); return; }
  if (act==='sq-next'){ SQ.i++; SQ.picked=null; makeOpts(); renderSigns(); return; }
  if (act==='sq-restart'){ buildSQ(); renderSigns(); return; }
});
document.addEventListener('change', function(e){
  if (e.target.id==='fc-filter'){ FC.filter=e.target.value; buildDeck(); renderCards(); }
  if (e.target.id==='sy-cat'){ SY.cat=e.target.value; buildSY(); renderSymbols(); }
  if (e.target.id==='sy-mode'){ SY.mode=e.target.value; SY.flip=false; renderSymbols(); }
  if (e.target.id==='sq-cat'){ SQ.cat=e.target.value; buildSQ(); renderSigns(); }
});
document.addEventListener('keydown', function(e){
  if ((location.hash||'')==='#symbols' && SY.deck.length && e.target.tagName!=='SELECT'){
    if (e.key===' '||e.key==='Enter'){ e.preventDefault(); SY.flip=!SY.flip; var g=document.getElementById('fc'); if(g) g.classList.toggle('flip',SY.flip); }
    else if (e.key==='ArrowRight'){ SY.i=(SY.i+1)%SY.deck.length; SY.flip=false; renderSymbols(); }
    else if (e.key==='ArrowLeft'){ SY.i=(SY.i-1+SY.deck.length)%SY.deck.length; SY.flip=false; renderSymbols(); }
    return;
  }
  if ((location.hash||'')!=='#cards' || !FC.deck.length) return;
  if (e.target.tagName==='SELECT') return;
  if (e.key===' '||e.key==='Enter'){ e.preventDefault(); FC.flip=!FC.flip; var f=document.getElementById('fc'); if(f) f.classList.toggle('flip',FC.flip); }
  else if (e.key==='ArrowRight'){ FC.i=(FC.i+1)%FC.deck.length; FC.flip=false; renderCards(); }
  else if (e.key==='ArrowLeft'){ FC.i=(FC.i-1+FC.deck.length)%FC.deck.length; FC.flip=false; renderCards(); }
});

route();
})();
</script>
</body>
</html>
